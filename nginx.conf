server
{
    listen 80;
    listen 443 ssl http2 ;
    server_name saqut.com;
    index index.html;
    root /www/wwwroot/saqut.com/saqutcompiler;
    include /www/server/panel/vhost/nginx/extension/saqut.com/*.conf;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/saqut.com.conf;
    #CERT-APPLY-CHECK--END
    #SSL-START
    #error_page 404/404.html;
    #HTTP_TO_HTTPS_START
    if ($server_port !~ 443){
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END
    ssl_certificate    /www/server/panel/vhost/cert/saqut.com/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/saqut.com/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497  https://$host$request_uri;
    #SSL-END

    #ERROR-PAGE-START
    error_page 404 /404.html;
    error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START
    include enable-php-00.conf;
    #PHP-INFO-END

    #REWRITE-START
    include /www/server/panel/vhost/rewrite/saqut.com.conf;
    #REWRITE-END

    # ── Root: Link headers + content negotiation ─────
    location = / {
        # RFC 8288 Link headers for agent discovery
        add_header Link '</.well-known/api-catalog>; rel="api-catalog"' always;
        add_header Link '</auth.md>; rel="service-doc"' always;
        add_header Link '</.well-known/mcp/server-card.json>; rel="mcp-server-card"' always;

        # Content negotiation: Accept: text/markdown -> /index.md
        if ($http_accept ~* "text/markdown") {
            rewrite ^ /index.md break;
        }
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Link '</.well-known/api-catalog>; rel="api-catalog"' always;
        add_header Link '</auth.md>; rel="service-doc"' always;
        add_header Link '</.well-known/mcp/server-card.json>; rel="mcp-server-card"' always;
    }

    # ── well-known dizini ─────
    location /.well-known/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Vary "Accept" always;
    }

    # ── Markdown for Agents: content negotiation ─────
    # /tr -> /tr/ (normal), /tr.md (agents)
    location = /tr {
        if ($http_accept ~* "text/markdown") {
            rewrite ^ /tr.md last;
        }
        return 301 /tr/;
    }

    # /tr/ -> /tr/index.html or /tr.md
    location = /tr/ {
        if ($http_accept ~* "text/markdown") {
            rewrite ^ /tr.md break;
        }
        try_files /tr/index.html =404;
    }

    # All other pages: /something/ -> /something.md when Accept: text/markdown
    location / {
        if ($http_accept ~* "text/markdown") {
            rewrite ^/(.+)/$ /$1.md last;
        }
        try_files $uri $uri/ $uri/index.html =404;
    }

    # /*.md -> serve as text/markdown
    location ~ \.md$ {
        default_type text/markdown;
        add_header Vary "Accept" always;
    }

    # Forbidden files or directories
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    # Directory verification related settings for one-click application for SSL certificate
    location ~ \.well-known{
        allow all;
    }

    #Prohibit putting sensitive files in certificate verification directory
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$
    {
        expires      12h;
        error_log /dev/null;
        access_log /dev/null;
    }
    access_log  /www/wwwlogs/saqut.com.log;
    error_log  /www/wwwlogs/saqut.com.error.log;
}
